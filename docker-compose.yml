services:
  db:
    image: postgres:16-alpine
    container_name: ready-to-mingle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rtm
      POSTGRES_PASSWORD: rtm
      POSTGRES_DB: rtm
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtm -d rtm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
